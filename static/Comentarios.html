<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolinga!</title>
    <link rel="shortcut icon" href="img/rolinga.ico" type="image/x-icon">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <script src="https://kit.fontawesome.com/fd04a21d6c.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="contenedor">
                <div class="menu"><a href="index.html">
                    <img src="img/LOGOrolinga.png" height="90" alt=""></a>
                </div>
            <ul>
                <li><a href="index.html">Eventos</a></li>
                <li><a href="Noticias.html">Noticias</a></li>
                <li><a href="Comentarios.html">Comentarios</a></li>
                <li><a href="Login.html">Inicia Sesion</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form id="create-event-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Nombre del Evento:</label>
                <input type="text" class="form-control" id="name" placeholder="Ingresa el nombre del evento" required>
            </div>
            <div class="form-group">
                <label for="location">Ubicación:</label>
                <input type="text" class="form-control" id="location" placeholder="Ingresa la ubicación del evento" required>
            </div>
            <div class="form-group">
                <label for="description">Descripción:</label>
                <textarea class="form-control" id="description" placeholder="Ingresa la descripción del evento" required></textarea>
            </div>
            <div class="form-group">
                <label for="image">Imagen del Evento:</label>
                <input type="file" class="form-control" id="image" required>
            </div>
            <div class="form-group">
                <label for="link">Enlace del Evento:</label>
                <input type="text" class="form-control" id="link" placeholder="Ingresa el enlace del evento" required>
            </div>
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">Crear Evento</button>
            </div>
        </form>
        <div id="message" class="mt-3"></div>
    </main>
    <footer>
        <a href="">Terminos y condiciones</a>
        <a href="">Preguntas frecuentes</a>
        <a href=""><i class="fas fa-question-circle"></i></a>
        <div class="social-icons">
            <a href="https://www.facebook.com"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.youtube.com/"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.instagram.com/"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <p>2024 Rolinga. Todos los derechos reservados.</p>
    </footer>
    <script>
       document.getElementById('create-event-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const fileInput = document.getElementById('image');
    const file = fileInput.files[0];

    if (!file) {
        console.error('No se seleccionó ningún archivo.');
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
        const data = {
            name: document.getElementById('name').value,
            location: document.getElementById('location').value,
            description: document.getElementById('description').value,
            image: event.target.result, // Aquí se accede a reader.result dentro de onload
            link: document.getElementById('link').value
        };        
        console.log(data);         
        fetch('/api/createnews', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            console.log(data); 
            
        })
        .catch(error => {
            console.error('Error al enviar los datos:', error);            
        });
    };

    reader.readAsDataURL(file); // Inicia la lectura del contenido del archivo como una URL base64
    });
    </script>
</body>
</html>
